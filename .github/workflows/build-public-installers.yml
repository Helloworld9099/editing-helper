name: Build judge demo installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    env:
      PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL || 'https://p01--editing-helper-api--fbvcc7mvswr6.code.run' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure public service (no shared token)
        run: python .github/scripts/write_release_config.py
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Unit tests
        working-directory: desktop
        run: npm test
      - name: Build installer candidate
        working-directory: desktop
        run: npx --yes electron-builder@26.18.0 --${{ matrix.target }} --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: editing-helper-judge-demo-${{ matrix.target }}-unsigned
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 14
