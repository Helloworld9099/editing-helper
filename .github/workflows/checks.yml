name: Editing Helper checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python knowledge_rag.py validate
      - run: python knowledge_rag.py build
      - run: python -m unittest discover -s tests -v
      - name: Audit installed Python dependencies
        shell: bash
        run: |
          python -m pip freeze > "$RUNNER_TEMP/backend-dependencies.txt"
          python -m pip install pip-audit
          python -m pip_audit --no-deps --disable-pip -r "$RUNNER_TEMP/backend-dependencies.txt"

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check renderer and upload disclosure
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python test/ui/ui_check.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t editing-helper-rag-check .
