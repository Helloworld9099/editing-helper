<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Editing Coach — Sign in</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="signin.css">
</head>
<body>
  <main class="sheet">
    <div class="mark" aria-hidden="true">EC</div>
    <h1>Sign in to Editing Coach</h1>
    <p class="intro">Get editing guidance with a secure, personal account. No server URL or API key needed.</p>

    <form id="request" novalidate>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email"
             maxlength="254" required placeholder="you@example.com">
      <button class="primary" id="send-code" type="submit">Send verification code</button>
    </form>

    <form id="verify" hidden novalidate>
      <p class="intro" id="email-sent"></p>
      <label for="code">Verification code</label>
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code"
             maxlength="8" pattern="[0-9]{6,8}" required placeholder="6-digit code">
      <button class="primary" id="verify-code" type="submit">Sign in</button>
      <button class="subtle" type="button" id="change-email">Use a different email</button>
    </form>

    <div id="account" hidden>
      <p class="intro" id="signed-in-as"></p>
      <button class="subtle" id="sign-out" type="button">Sign out</button>
    </div>
    <p id="status" class="status" role="status"></p>
    <p id="error" class="error" role="alert"></p>
    <p class="notice">Only your verified account is sent to the Editing Coach API. Your editing questions are processed to generate answers.</p>
  </main>
  <script src="signin.js"></script>
</body>
</html>
