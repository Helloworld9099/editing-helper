<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Editing Coach</title>
  <link rel="stylesheet" href="mascot.css">
</head>
<body>
  <div id="pet" role="button" tabindex="0" aria-label="Open Editing Coach. Right-click for menu.">
    <!-- The original teal clapperboard sidekick, with additional light and expression. -->
    <svg viewBox="0 0 96 96" width="96" height="96" aria-hidden="true" focusable="false" draggable="false">
      <defs>
        <linearGradient id="pet-body" x1="0%" y1="0%" x2="94%" y2="100%">
          <stop offset="0%" stop-color="#b9f3df"/>
          <stop offset="42%" stop-color="#70d7bd"/>
          <stop offset="100%" stop-color="#2b998d"/>
        </linearGradient>
        <linearGradient id="pet-hat" x1="0%" y1="0%" x2="20%" y2="100%">
          <stop offset="0%" stop-color="#2b5054"/>
          <stop offset="100%" stop-color="#102f37"/>
        </linearGradient>
        <linearGradient id="pet-gloss" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity=".65"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <ellipse cx="48" cy="89" rx="23" ry="4.2" fill="#153f3e" opacity=".18"/>
      <g class="character">
        <path class="body" d="M18 54 C17 38 28 27 44 24 C63 21 76 34 79 51 C83 69 72 82 53 84 C33 87 18 74 18 54Z"
              fill="url(#pet-body)" stroke="#258d80" stroke-width="2.6"/>
        <path d="M24 48 C28 35 38 29 50 30 C39 36 30 47 27 59Z" fill="url(#pet-gloss)" opacity=".9"/>
        <ellipse cx="49" cy="72" rx="16" ry="8" fill="#d0f7e7" opacity=".34"/>
        <g class="cheeks" opacity=".48">
          <ellipse cx="30" cy="62" rx="6.5" ry="3.5" fill="#f6a59e"/>
          <ellipse cx="67" cy="62" rx="6.5" ry="3.5" fill="#f6a59e"/>
        </g>
        <g class="eyes">
          <ellipse cx="38" cy="52" rx="5.2" ry="6.4" fill="#123840"/>
          <ellipse cx="58" cy="52" rx="5.2" ry="6.4" fill="#123840"/>
          <circle cx="40" cy="49.8" r="1.9" fill="#ffffff"/>
          <circle cx="60" cy="49.8" r="1.9" fill="#ffffff"/>
          <circle cx="36.3" cy="54.8" r=".8" fill="#a9d8cd"/>
          <circle cx="56.3" cy="54.8" r=".8" fill="#a9d8cd"/>
        </g>
        <g class="blink-lines">
          <path d="M33 52 Q38 48 43 52 M53 52 Q58 48 63 52"
                fill="none" stroke="#173840" stroke-width="2.8" stroke-linecap="round"/>
        </g>
        <path class="smile" d="M39 66 Q48 74 57 66" stroke="#174b48" stroke-width="2.9" fill="none" stroke-linecap="round"/>
        <path d="M42 68 Q48 70 54 68" stroke="#ffffff" stroke-width="1" fill="none" opacity=".65"/>
        <g class="hat">
          <rect x="20" y="16" width="56" height="18" rx="4" fill="url(#pet-hat)"/>
          <rect x="21" y="30.5" width="54" height="4.5" rx="1.7" fill="#376c6d"/>
          <path d="M27 16 H35 L31 30 H23 Z M44 16 H52 L48 30 H40 Z M61 16 H69 L65 30 H57 Z"
                fill="#eff9f4"/>
          <path d="M22 20 V20.6 M74 20 V20.6" stroke="#ffffff" stroke-opacity=".2" stroke-width="2"/>
          <rect x="24" y="34" width="48" height="1.5" rx=".7" fill="#133e41" opacity=".22"/>
        </g>
      </g>
      <g class="badge">
        <circle cx="80" cy="16" r="10.5" fill="#fffefa" opacity=".98"/>
        <circle cx="80" cy="16" r="7.5" fill="#f5b74f"/>
        <circle cx="78" cy="13.6" r="1.8" fill="#fff0bd"/>
      </g>
    </svg>
  </div>
  <script src="mascot.js"></script>
</body>
</html>
