<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Editing Coach</title>
  <link rel="stylesheet" href="mascot.css">
</head>
<body>
  <div id="pet" role="button" tabindex="0" aria-label="Open Editing Coach. Right-click for menu.">
    <!-- Original mascot: a teal blob wearing a clapperboard cap. -->
    <svg viewBox="0 0 96 96" width="96" height="96" aria-hidden="true" focusable="false" draggable="false">
      <ellipse cx="48" cy="88" rx="22" ry="4" fill="#000000" opacity="0.18"/>
      <ellipse cx="48" cy="54" rx="31" ry="30" fill="#5ec4b6" stroke="#2b8f83" stroke-width="3"/>
      <rect x="20" y="16" width="56" height="17" rx="3" fill="#102a43"/>
      <polygon points="26,16 35,16 31,33 22,33" fill="#f0f4f8"/>
      <polygon points="42,16 51,16 47,33 38,33" fill="#f0f4f8"/>
      <polygon points="58,16 67,16 63,33 54,33" fill="#f0f4f8"/>
      <g class="eyes">
        <circle cx="38" cy="52" r="5.5" fill="#102a43"/>
        <circle cx="58" cy="52" r="5.5" fill="#102a43"/>
        <circle cx="40" cy="50" r="1.8" fill="#ffffff"/>
        <circle cx="60" cy="50" r="1.8" fill="#ffffff"/>
      </g>
      <path d="M39 65 Q48 72 57 65" stroke="#102a43" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g class="badge">
        <circle cx="80" cy="16" r="9" fill="#f4b400" stroke="#ffffff" stroke-width="3"/>
      </g>
    </svg>
  </div>
  <script src="mascot.js"></script>
</body>
</html>
