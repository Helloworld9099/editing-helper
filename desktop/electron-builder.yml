appId: org.editinghelper.desktop
productName: Editing Helper
directories:
  output: dist
  buildResources: build
asar: true
files:
  - src/**/*
  - renderer/**/*
  - package.json
  - node_modules/marked/**/*
  - node_modules/dompurify/**/*
  - '!**/*.map'
  - '!test/**/*'
  - '!tools/**/*'
linux:
  category: AudioVideo
  syncDesktopName: true
  maintainer: 'Editing Helper <maintainer@editing-helper.invalid>'
  target:
    - AppImage
    - deb
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.video
  target:
    - dmg
publish: null
